name: TaskNest CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r backend/requirements.txt
      - name: Python syntax and undefined-name checks
        working-directory: backend
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Backend security tests
        working-directory: backend
        env:
          SECRET_KEY: tasknest-ci-secret-key
          GITHUB_TOKEN_ENCRYPTION_KEY: ZmFrZS1mb3ItY2ktdXNlLW9ubHktMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
